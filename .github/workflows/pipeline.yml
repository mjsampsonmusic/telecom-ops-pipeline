name: nightly-etl

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"   # nightly at 06:00 UTC
  workflow_dispatch:

jobs:
  test-and-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit and integration tests
        run: python -m unittest discover -s tests -v
      - name: Run pipeline (with injected API failures)
        run: python -m pipeline.run --fail-rate 0.1
      - name: Publish dashboard
        uses: actions/upload-artifact@v4
        with:
          name: kpi-dashboard
          path: reports/dashboard.html
